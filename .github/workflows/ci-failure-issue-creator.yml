# Direct edits in downstream repositories will be overwritten by the next sync.
# Update the source file in HiromiShikata/repositories-management instead.

name: Create Issue on Default Branch CI Failure

on:
  check_suite:
    types:
      - completed

permissions:
  issues: write

jobs:
  create-or-comment-on-ci-failure:
    runs-on: ${{ github.event.repository.private && 'blacksmith-2vcpu-ubuntu-2204' || 'ubuntu-latest' }}
    if: |
      github.event.check_suite.conclusion == 'failure' &&
      github.event.check_suite.head_branch == github.event.repository.default_branch
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Generate hs-bot-gh-ap installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HS_BOT_GH_AP_CLIENT_ID }}
          private-key: ${{ secrets.HS_BOT_GH_AP_PRIVATE_KEY }}
          owner: HiromiShikata
      - uses: HiromiShikata/github-action-create-ci-failure-issue@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
