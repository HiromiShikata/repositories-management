name: Scripts TypeScript CI

on:
  pull_request:
    paths:
      - 'scripts/typescript/**'
  workflow_dispatch:

concurrency:
  group: scripts-typescript-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: scripts/typescript
      - name: Lint
        run: npm run lint
        working-directory: scripts/typescript
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: scripts/typescript
      - name: Test (changed since base)
        if: github.event_name == 'pull_request'
        run: npx jest --changedSince=origin/${{ github.event.pull_request.base.ref }}
        working-directory: scripts/typescript
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test (full suite)
        if: github.event_name != 'pull_request'
        run: npx jest
        working-directory: scripts/typescript
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
