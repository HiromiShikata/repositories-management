name: Invite umino-bot as monthly collaborator

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  invite:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - run: |
          cd scripts/typescript
          npm i
          npx tsx src/adapter/entry-points/cli/invite-umino-bot-monthly.ts
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          UMINO_BOT_TOKEN: ${{ secrets.UMINO_BOT_TOKEN }}
